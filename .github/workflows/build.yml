name: build

# Three jobs, deliberately separated by how likely they are to work:
#
#   host-tests      pure C++ and Node, no platform deps. Should always be green.
#   windows-crypto  MSVC + BCrypt, but NO UE4SS. Proves the encryption
#                   interoperates with Node in both directions.
#   windows-dll     the real artifact. Needs the UE4SS source tree and is the
#                   only job with genuine unknowns in it.
#
# The split matters: if windows-dll fails on a UE4SS path detail, the crypto and
# protocol work is still verified rather than being blocked behind it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host tests (protocol + base64 interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and run
        working-directory: tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I../src test_protocol.cpp -o test_protocol
          g++ -std=c++17 -Wall -Wextra -Werror -I../src test_envelope.cpp -o test_envelope
          ./test_protocol
          node envelope_interop.js emit | ./test_envelope | node envelope_interop.js check

  windows-crypto:
    name: windows crypto (BCrypt <-> Node interop)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ilammy/msvc-dev-cmd@v1

      # /W4 rather than /WX for now: these files have never been through MSVC and
      # the first pass will surface warnings worth reading rather than silencing.
      - name: Compile with MSVC
        shell: cmd
        working-directory: tests
        run: |
          cl /std:c++17 /EHsc /W4 /nologo /I..\src test_protocol.cpp /Fe:test_protocol.exe
          cl /std:c++17 /EHsc /W4 /nologo /I..\src test_crypto_win.cpp /Fe:test_crypto_win.exe /link bcrypt.lib

      - name: Protocol tests under MSVC
        shell: cmd
        working-directory: tests
        run: test_protocol.exe

      # Node seals, C++ opens; then C++ seals, Node opens. Disagreement about tag
      # placement, IV length or base64 canonicality shows up here rather than as
      # "[unreadable]" on every line in game.
      - name: Encryption interop, both directions
        shell: cmd
        working-directory: tests
        run: node envelope_interop.js emit | test_crypto_win.exe | node envelope_interop.js verify

  windows-dll:
    name: windows DLL (UE4SS mod)
    runs-on: windows-latest
    # xmake is retired for this job — see "The UE4SS build: use CMake, not
    # xmake" in CLAUDE.md. CMake >= 3.22 is UE4SS's own documented default,
    # confirmed against docs/guides/creating-a-c++-mod.md and RE-UE4SS's own
    # cmake_build_ue4ss.yml. Still marked continue-on-error until a run has
    # actually gone green with this pipeline — flip it once it has.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod

      - uses: ilammy/msvc-dev-cmd@v1

      # UE4SS's own CMakeLists.txt add_subdirectory()s deps/first/Unreal
      # unconditionally to build its core target — which any real C++ mod
      # links against, xmake or CMake, doesn't matter. That submodule
      # (Re-UE4SS/UEPseudo) is private, gated behind Epic Games' Unreal
      # source-access program. EPIC_SUBMODULE_TOKEN is a classic PAT (repo
      # scope only) from an account the repo owner has linked and had
      # accepted into the @EpicGames org — see GETTING-STARTED.md Part 4a.
      #
      # HTTPS with the token embedded via url.insteadOf, not SSH: the runner
      # has no SSH key. git does not print the rewritten URL at this
      # verbosity, and GitHub Actions masks the literal secret value in any
      # log output regardless, so it never surfaces even if that changes.
      - name: Authenticate the private Unreal submodule
        shell: bash
        run: |
          git config --global url."https://x-access-token:${EPIC_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          EPIC_TOKEN: ${{ secrets.EPIC_SUBMODULE_TOKEN }}

      - name: Clone RE-UE4SS with submodules
        run: >
          git clone --depth 1 --recursive --shallow-submodules
          https://github.com/UE4SS-RE/RE-UE4SS.git ue4ss

      # The official pattern (docs/guides/creating-a-c++-mod.md): a small
      # top-level project that add_subdirectory()s RE-UE4SS and the mod as
      # siblings. Both files here are generated per-run, not committed — they
      # only make sense next to a fresh ue4ss/ checkout.
      #
      # ixwebsocket and nlohmann_json used to come from xmake's add_requires;
      # vcpkg.json replaces that. This runner's bundled vcpkg is manifest-mode
      # only (classic `vcpkg install <port>` is disabled), so the manifest is
      # what makes the toolchain file below install these automatically during
      # cmake configure. ixwebsocket's vcpkg port already selects mbedTLS as
      # its default SSL backend on Windows, matching the old `ssl = "mbedtls"`.
      - name: Write the top-level CMake project
        shell: bash
        run: |
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(PalworldRpChatBuild)
          add_subdirectory(ue4ss)
          add_subdirectory(mod)
          EOF
          cat > vcpkg.json <<'EOF'
          {
            "name": "palworld-rp-chat-build",
            "version": "0.1.0",
            "builtin-baseline": "ea1a7396b05637a53bf23c078647ecc0edee4b80",
            "dependencies": ["ixwebsocket", "nlohmann-json"]
          }
          EOF

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Game__Shipping__Win64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --target PalworldRpChat

      - name: Collect the DLL
        if: always()
        shell: bash
        run: |
          mkdir -p out/PalworldRpChat/Scripts
          # Only our own compiled DLL and our own Lua scripts. Nothing from
          # ue4ss/ (Epic-derived headers, UE4SS.dll, its own assets) belongs
          # in this artifact — see CLAUDE.md.
          find build -iname 'PalworldRpChat.dll' -exec cp {} out/PalworldRpChat/ \; || true
          cp mod/Scripts/*.lua out/PalworldRpChat/Scripts/ || true
          cp mod/README.md out/ || true
          find out -type f

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PalworldRpChat
          # Retained even on failure: a partial tree plus the build log is what
          # makes the next attempt cheap.
          path: out
          if-no-files-found: warn
